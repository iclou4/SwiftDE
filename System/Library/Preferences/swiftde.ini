# SwiftDE session config (Wayfire). Installed as ~/.config/wayfire.ini equivalent
# via swiftde-session. GNOME is not started in this session.

[core]
plugins = \
  alpha \
  animate \
  autostart \
  command \
  decoration \
  expo \
  fast-switcher \
  grid \
  move \
  place \
  resize \
  scale \
  session-lock \
  switcher \
  vswitch \
  window-rules \
  wm-actions \
  ipc \
  ipc-rules \
  zoom \
  blur

[blur]
method = kawase
blur_by_default = (type is "panel") | (title is "About This Mac")
kawase_offset = 6.0
kawase_degrade = 1
kawase_iterations = 4
saturation = 1.10
alpha_threshold = 0.05
alpha_exponent = 0.2

# macOS Sequoia Window Open / Close Animations
[animate]
open_animation = zoom
close_animation = zoom
duration = 200 ms cubic-bezier 0.16 1.0 0.3 1.0
open_duration = 200 ms cubic-bezier 0.16 1.0 0.3 1.0
close_duration = 160 ms cubic-bezier 0.25 1.0 0.5 1.0
zoom_open_scale = 0.88
zoom_close_scale = 0.92
enabled_for = (type is "toplevel" & !(title is "About This Mac"))

vwidth = 4
vheight = 1
close_top_view = <super> KEY_Q | <alt> KEY_F4
preferred_decoration_mode = client

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[zoom]
modifier = <super>

[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_down = <ctrl> <super> KEY_DOWN
binding_up = <ctrl> <super> KEY_UP
binding_right = <ctrl> <super> KEY_RIGHT
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_down = <ctrl> <super> <shift> KEY_DOWN
with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT

# Mission Control (spaces overview) / Expose (windows overview)
[expo]
toggle = <super> KEY_UP

[scale]
toggle = <super> KEY_DOWN

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[input]
cursor_theme = SwiftDE
cursor_size = 24

[autostart]
autostart_wf_shell = false
env_sync = /bin/sh -c "dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE GSK_RENDERER LIBGL_ALWAYS_SOFTWARE; systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE GSK_RENDERER LIBGL_ALWAYS_SOFTWARE"
desktop = /home/gg/SwiftDE/SwiftDE-RunQML --desktop /home/gg/SwiftDE/System/Library/CoreServices/Desktop.app/Contents/Resources/Desktop.qml
topbar = /home/gg/SwiftDE/SwiftDE-RunQML --topbar /home/gg/SwiftDE/System/Library/CoreServices/Topbar.app/Contents/Resources/Topbar.qml
dock = /home/gg/SwiftDE/SwiftDE-RunQML --dock /home/gg/SwiftDE/System/Library/CoreServices/Dock.app/Contents/Resources/Dock.qml
lockscreen = /home/gg/SwiftDE/SwiftDE-RunQML --layer /home/gg/SwiftDE/System/Library/CoreServices/Lockscreen.app/Contents/Resources/Lockscreen.qml

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = gnome-terminal
# SwiftDE Lockscreen (macOS ⌃⌘Q or ⇧⌘Esc)
binding_lock = <ctrl> <super> KEY_Q | <super> <shift> KEY_ESC
command_lock = /home/gg/SwiftDE/SwiftDE-RunQML --layer /home/gg/SwiftDE/System/Library/CoreServices/Lockscreen.app/Contents/Resources/Lockscreen.qml
# SwiftDE Launchpad (macOS F4 or ⌘Space)
binding_launchpad = KEY_F4
command_launchpad = /home/gg/SwiftDE/SwiftDE-RunQML --layer /home/gg/SwiftDE/System/Library/CoreServices/Launchpad.app/Contents/Resources/Launchpad.qml

[place]
mode = center

[window-rules]
rule_about = on created if title is "About This Mac" then set geometry 510 191 260 418

